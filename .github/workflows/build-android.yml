name: Compilar Nexa Android
on:
  workflow_dispatch:
  push:
    paths:
      - nexa-android-project.zip
      - .github/workflows/build-android.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Preparar projeto
        run: |
          unzip -q nexa-android-project.zip
          chmod +x nexa-android/gradlew
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK
        working-directory: nexa-android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Nexa-Android-APK
          path: nexa-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publicar APK de teste
        run: |
          cp nexa-android/app/build/outputs/apk/debug/app-debug.apk Nexa-teste.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Nexa-teste.apk
          git commit -m 'Publicar APK de teste da Nexa' || exit 0
          git push
